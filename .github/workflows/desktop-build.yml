name: GUI and CLI build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build GUI (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            packages: dmg dmg macos-arm64.dmg
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            packages: nsis exe windows-x64-setup.exe
          - platform: linux-x64
            # Keep the glibc baseline below Deepin 25's, including for AppImage.
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            packages: |
              deb deb linux-x64.deb
              appimage AppImage linux-x64.AppImage
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2 xdg-utils
      - name: Check application and release versions
        run: npm run check:version
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Build native installer
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_BUNDLES: ${{ matrix.bundles }}
          # Preserve Finder layout and the packager's 128px icons in CI DMGs.
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
        run: npm run tauri -- build --ci --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES" -- --locked
      - name: Verify macOS package
        if: runner.os == 'macOS'
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          codesign --verify --deep --strict "src-tauri/target/$BUILD_TARGET/release/bundle/macos/RKDevTool Next.app"
          hdiutil verify src-tauri/target/"$BUILD_TARGET"/release/bundle/dmg/*.dmg
      - name: Collect installers
        env:
          BUILD_TARGET: ${{ matrix.target }}
          PACKAGES: ${{ matrix.packages }}
        run: |
          version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          bundle_root="src-tauri/target/$BUILD_TARGET/release/bundle"
          shopt -s nullglob
          mkdir -p release
          while read -r bundle_dir extension suffix; do
            [[ -n "$bundle_dir" ]] || continue
            files=("$bundle_root/$bundle_dir/"*."$extension")
            if [[ ${#files[@]} -ne 1 || ! -s "${files[0]}" ]]; then
              echo "Expected exactly one nonempty .$extension installer in $bundle_root/$bundle_dir" >&2
              exit 1
            fi
            cp "${files[0]}" "release/RKDevTool-Next_${version}_${suffix}"
          done <<< "$PACKAGES"
      - uses: actions/upload-artifact@v7
        with:
          name: RKDevTool-Next-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  build_cli:
    name: Build CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: rkdevcli
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            binary: rkdevcli.exe
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: rkdevcli
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check application and release versions
        run: npm run check:version
      - name: Build and smoke-test standalone CLI
        env:
          BUILD_TARGET: ${{ matrix.target }}
          CLI_BINARY: ${{ matrix.binary }}
        run: |
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml \
            --target "$BUILD_TARGET" --no-default-features --features headless-cli --bin rkdevcli
          version="$(node -p 'require("./package.json").version')"
          binary="src-tauri/target/$BUILD_TARGET/release/$CLI_BINARY"
          [[ "$("$binary" --version | tr -d '\r')" == "rkdevcli $version" ]]
          "$binary" serve --help
      - name: Package macOS or Linux CLI
        if: runner.os != 'Windows'
        env:
          BUILD_TARGET: ${{ matrix.target }}
          CLI_BINARY: ${{ matrix.binary }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          mkdir -p release
          tar -czf "release/RKDevTool-Next-CLI_${version}_${PLATFORM}.tar.gz" \
            -C "src-tauri/target/$BUILD_TARGET/release" "$CLI_BINARY"
      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
          CLI_BINARY: ${{ matrix.binary }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $version = node -p 'require("./package.json").version'
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -LiteralPath "src-tauri/target/$env:BUILD_TARGET/release/$env:CLI_BINARY" `
            -DestinationPath "release/RKDevTool-Next-CLI_${version}_$env:PLATFORM.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: RKDevTool-Next-CLI-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build_cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: RKDevTool-Next-*
          path: release
          merge-multiple: true
      - name: Publish complete GUI and CLI asset set
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          assets=(
            "release/RKDevTool-Next_${version}_macos-arm64.dmg"
            "release/RKDevTool-Next_${version}_windows-x64-setup.exe"
            "release/RKDevTool-Next_${version}_linux-x64.deb"
            "release/RKDevTool-Next_${version}_linux-x64.AppImage"
            "release/RKDevTool-Next-CLI_${version}_macos-arm64.tar.gz"
            "release/RKDevTool-Next-CLI_${version}_windows-x64.zip"
            "release/RKDevTool-Next-CLI_${version}_linux-x64.tar.gz"
          )
          for asset in "${assets[@]}"; do
            [[ -s "$asset" ]] || { echo "Missing asset: $asset" >&2; exit 1; }
          done
          cat > release-notes.md <<'NOTES'
          ## 下载 / Downloads
          - **macos-arm64.dmg**：Apple Silicon（M 系列）Mac
          - **windows-x64-setup.exe**：Windows x64 安装程序
          - **linux-x64.deb / linux-x64.AppImage**：Linux x86_64 桌面版；Debian 系可选 `.deb`，免安装可选 `.AppImage`。USB 访问需配置本机 udev 权限。
          - **RKDevTool-Next-CLI**：macOS arm64、Windows x64、Linux x64 命令行版。入口已更名为 `rkdevcli`（Windows 为 `rkdevcli.exe`）；升级时请更新脚本和 MCP 启动命令。无需 GUI；烧录需显式启用 `--allow-flash`。

          macOS 包使用 ad-hoc 签名，未经过 Apple 公证；Windows 包尚未配置代码签名，系统可能显示安全提示。Windows USB 通信需要目标 Rockusb 接口使用 WinUSB。

          使用与开发板匹配的 Loader 和固件。写入或擦除前备份重要数据。功能、安装和构建说明见仓库 README。
          NOTES
          if draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [[ "$draft" == true ]] || { echo 'Release already published; use a new version instead of replacing it.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "RKDevTool Next $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
