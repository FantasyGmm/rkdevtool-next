[package]
name = "rkdevtool-next"
version = "0.1.5"
description = "Native cross-platform Rockchip flashing tool"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"

[lib]
name = "rkdevtool_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
nusb = { version = "0.2.1", features = ["tokio"] }
rockusb = { version = "=0.4.0", features = ["nusb"] }
rockfile = "=0.1.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures-util = "0.3"

# In-process archive readers; no external unzip/xz/gzip/bzip2 CLI at runtime.
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
xz2 = { version = "0.1", features = ["static"] }
bzip2 = { version = "0.5", features = ["static"] }
tempfile = "3"
